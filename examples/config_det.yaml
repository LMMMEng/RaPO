## Detection-specific config — inherits from config.yaml via CLI override.
## Only overrides resolution settings for object detection tasks.
##
## Usage in scripts:  config=examples/config_det.yaml
##
## Train resolution: min 512x512, max ~634x634 (Visual-RFT standard)
## Val   resolution: same as train (can be overridden per-script)

data:
  train_files: ""
  val_files: ""
  prompt_key: prompt
  answer_key: answer
  image_key: images
  format_prompt: ./examples/format_prompt/det.jinja
  video_key: videos
  image_dir: null
  video_fps: 2.0
  max_prompt_length: 2048
  max_response_length: 2048
  rollout_batch_size: 128
  mini_rollout_batch_size: null
  val_batch_size: 64
  override_chat_template: null
  shuffle: true
  seed: 1
  min_pixels: 262144 # 512x512
  max_pixels: 401408 # ~634x634, Visual-RFT det standard (~512 image tokens)
  filter_overlong_prompts: true

algorithm:
  adv_estimator: grpo
  disable_kl: false
  use_kl_loss: true
  kl_penalty: low_var_kl
  kl_coef: 1.0e-2
  online_filtering: false
  filter_key: overall
  filter_low: 0.01
  filter_high: 0.99

worker:
  actor:
    global_batch_size: 32
    micro_batch_size_per_device_for_update: 2
    micro_batch_size_per_device_for_experience: 4
    max_grad_norm: 1.0
    padding_free: true
    dynamic_batching: true
    ulysses_size: 1
    model:
      model_path: Qwen/Qwen2-VL-2B-Instruct
      enable_gradient_checkpointing: true
      trust_remote_code: false
      freeze_vision_tower: false
      lora:
        rank: 0
        alpha: 64
        target_modules: all-linear
        exclude_modules: .*visual.*
    optim:
      lr: 1.0e-6
      weight_decay: 1.0e-2
      strategy: adamw_bf16
      lr_warmup_ratio: 0.0
    fsdp:
      enable_full_shard: true
      enable_cpu_offload: false
      enable_rank0_init: true
      torch_dtype: bfloat16
    offload:
      offload_params: false
      offload_optimizer: false

  rollout:
    n: 8
    temperature: 1.0
    top_p: 1.0
    limit_images: 0
    gpu_memory_utilization: 0.8
    enforce_eager: false
    enable_chunked_prefill: false
    tensor_parallel_size: 1
    disable_tqdm: true
    val_override_config:
      temperature: 0.6
      top_p: 0.95
      n: 1

  ref:
    fsdp:
      enable_full_shard: true
      enable_cpu_offload: true
      enable_rank0_init: true
      torch_dtype: bfloat16
    offload:
      offload_params: false

  reward:
    reward_function: ./examples/reward_function/det.py:compute_score

trainer:
  total_epochs: 2
  max_steps: null
  project_name: easy_r1
  experiment_name: evalutions
  logger: ["file"]
  nnodes: 1
  n_gpus_per_node: 8
  max_try_make_batch: 20
  val_freq: -1
  val_before_train: false
  val_only: false
  val_generations_to_log: 5
  save_freq: -1
  save_limit: 3
  save_model_only: false
  save_checkpoint_path: null
  load_checkpoint_path: null
  find_last_checkpoint: true
